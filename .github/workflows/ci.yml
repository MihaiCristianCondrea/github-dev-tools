name: CI

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Validate, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate locales, build, and test
        run: npm run check
